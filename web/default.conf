# Web de inicio. Las cabeceras de seguridad y la analítica las pone el gateway.

# En el log, el X-Request-ID que manda el gateway (o uno propio si se llama directamente)
map $http_x_request_id $log_request_id { "" $request_id; default $http_x_request_id; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Detrás de Traefik nginx ve http: una redirección absoluta (la de `/dir` → `/dir/`) saldría con
    # http:// y daría dos saltos. Relativas, el navegador conserva https (AGENTS.md §9.2).
    absolute_redirect off;

    # Ruta inexistente: 404 de verdad, nunca un 200 con la portada (soft 404)
    error_page 404 /404.html;

    # Healthcheck del servicio (lo usa Docker; el gateway no lo publica)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
