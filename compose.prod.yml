# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCCIÓN en Coolify (aplicación Docker Compose)
#
#  Las imágenes las publica GitHub Actions en GHCR (.github/workflows/deploy.yml):
#  el servidor solo las descarga y arranca, nunca compila. Coolify lee este
#  archivo del repositorio y su Traefik pone el dominio y el certificado.
#
#  Reglas de la plataforma (infra-ionos-vps, clientes/README.md):
#  - Dominio: SOLO al servicio `gateway`, puerto 80.
#  - Sin `ports:`: solo el gateway es alcanzable, y solo desde Traefik.
#  - Todo servicio lleva mem_limit: varios clientes comparten servidor.
#  - Todo lo que termina en `:?` es obligatorio: si falta, el despliegue se detiene.
# ─────────────────────────────────────────────────────────────────────────────

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX, p. ej. ghcr.io/yitztech/acme.com}-gateway:${IMAGE_TAG:-main}
    # nginx necesita estas capacidades para arrancar como root y bajar a su usuario
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 64m
    cpus: 0.25
    environment:
      # Subred de la red de esta app donde está Traefik (se mide tras el primer arranque)
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Define la subred de Traefik}
      # Analítica con Umami (vacío = sin analítica). Las pone el alta del cliente.
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      web: { condition: service_started }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  # La web del cliente. De inicio, una página estática; se sustituye por la aplicación real
  # manteniendo el nombre del servicio, o se añaden servicios y rutas en el gateway.
  # Variables que el alta pone a disposición del compose (añadir las que use la app):
  #   SITE_URL, SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASSWORD, MAIL_FROM,
  #   LISTMONK_URL, LISTMONK_LIST_UUID, UMAMI_SCRIPT_URL, UMAMI_WEBSITE_ID
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-web:${IMAGE_TAG:-main}
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 64m
    cpus: 0.25
    networks: [frontend]

  # Base de datos, si la app la necesita. La contraseña la genera el alta: en la ficha,
  #   cliente_web_env_secretos: { POSTGRES_PASSWORD: db }
  # El backup de la plataforma vuelca cada contenedor PostgreSQL en marcha.
  #
  # postgres:
  #   restart: unless-stopped
  #   image: postgres:18-alpine
  #   security_opt: [no-new-privileges:true]
  #   mem_limit: 512m
  #   cpus: 1.0
  #   environment:
  #     POSTGRES_DB: app
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql   # PostgreSQL 18: se monta en /var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U app -d app"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 20
  #   networks: [backend]

# volumes:
#   postgres-data:

networks:
  frontend:
